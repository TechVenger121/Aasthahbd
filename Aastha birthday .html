<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday Aastha</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Patrick+Hand&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --background: #463622;
      --heading: #9b7a50;
      --cream: #fff0c6;
      --button: #653500;
      --orange: #ffac1f;
      --pink: #ff957d;
      --arrow: #b76000;
    }

    body {
      background: var(--background);
      min-height: 100vh;
      font-family: "Roboto Condensed", sans-serif;
      color: var(--cream);
    }

    .page {
      position: relative;

      width: min(100vw, 720px);
      height: 100svh;
      min-height: 760px;

      margin: auto;

      background: var(--background);

      overflow: hidden;
    }

    /* Birthday heading */

    .hero {
      position: absolute;

      top: 34%;
      left: 0;

      width: 100%;

      text-align: center;

      transform: translateY(-50%);
    }

    .hero h1 {
      font-family: "Anton", sans-serif;

      font-size: clamp(3.5rem, 10vw, 6.4rem);
      font-weight: 400;

      letter-spacing: 1px;

      color: var(--heading);

      white-space: nowrap;
    }

    /* AASTHA */

    .name {
      margin-top: 12px;

      font-family: "Patrick Hand", cursive;

      font-size: clamp(4rem, 12vw, 7rem);

      line-height: 0.85;

      color: var(--cream);
    }

    .aka {
      margin-top: 14px;

      font-size: clamp(1.15rem, 3vw, 1.65rem);

      color: var(--cream);
    }

    /* Special message text */

    .message-text {
      position: absolute;

      top: 61%;
      right: 9%;

      font-family: "Patrick Hand", cursive;

      font-size: clamp(1.3rem, 3.6vw, 2rem);

      line-height: 1.25;

      color: var(--pink);

      transform: rotate(-2deg);
    }

    /* Arrow */

    .arrow {
      position: absolute;

      left: 7%;
      top: 58%;

      width: 32%;
      height: 15%;

      overflow: visible;
    }

    .arrow path {
      fill: none;

      stroke: var(--arrow);
      stroke-width: 14;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Button */

    .click-btn {
      position: absolute;

      top: 70%;
      left: 50%;

      transform: translate(-50%, -50%);

      padding: 14px 38px 17px;

      border: none;
      border-radius: 15px;

      background: var(--button);
      color: #ffd59a;

      font-family: "Roboto Condensed", sans-serif;

      font-size: clamp(2rem, 6vw, 3.5rem);

      text-decoration: none;

      box-shadow: 8px 9px 10px rgba(44, 36, 28, 0.6);

      cursor: pointer;

      white-space: nowrap;

      transition: 0.2s;
    }

    .click-btn:hover {
      transform: translate(-50%, -50%) scale(1.04);
    }

    .click-btn:active {
      transform: translate(-50%, -47%) scale(0.98);
    }

    /* Bottom credit */

    .credit {
      position: absolute;

      bottom: 4.8%;

      width: 100%;

      text-align: center;

      color: var(--orange);

      font-size: clamp(1.25rem, 3.6vw, 2rem);

      line-height: 1.18;
    }

    /* Small height phones */

    @media (max-height: 800px) {

      .hero {
        top: 30%;
      }

      .message-text {
        top: 57%;
      }

      .arrow {
        top: 54%;
      }

      .click-btn {
        top: 68%;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="hero">

      <h1>HAPPY BIRTHDAY</h1>

      <div class="name">
        Aastha
      </div>

      <div class="aka">
        (aka bablu)
      </div>

    </section>


    <!-- Curved arrow -->

    <svg
      class="arrow"
      viewBox="0 0 300 180"
      aria-hidden="true"
    >

      <path
        d="
        M20 15
        C80 25 145 70 205 130

        M205 130
        L198 80

        M205 130
        L153 127
        "
      />

    </svg>


    <!-- Text beside arrow -->

    <div class="message-text">

      tere liye special voice msg

    </div>


    <!-- CLICKABLE BUTTON -->

    <a
  href="https://littlevoicenote.com/m/5f635dbc"
  class="click-btn"
  target="_blank"
  rel="noopener noreferrer"
>
  Click btn
</a>


    <!-- Credit -->

    <div class="credit">

      Made by Raunak

      <br>

      ( tera smart bhai )
      <br>
      heheheheh

    </div>

  </main>

</body>
</html>
